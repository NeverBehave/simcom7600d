name: Build main artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify deliverables
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/client/package-lock.json
            web/ui/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test Go server
        run: go test ./...

      - name: Test headless server build
        run: go test -tags headless ./...

      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Install TypeScript client dependencies
        run: npm --prefix web/client ci --no-audit --no-fund

      - name: Install web UI dependencies
        run: npm --prefix web/ui ci --no-audit --no-fund

      - name: Test web UI
        run: |
          npm --prefix web/client run typecheck
          bash web/client/test/fixtures/run.sh
          npm --prefix web/ui run test
          npm --prefix web/ui run typecheck
          npm --prefix web/ui run lint

      - name: Audit JavaScript dependencies
        run: |
          npm --prefix web/client audit --audit-level=moderate
          npm --prefix web/ui audit --audit-level=moderate

      - name: Test Android app
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build packaged artifacts
        run: VERSION="main-${GITHUB_SHA:0:12}" ./scripts/build-artifacts.sh

      - name: Verify committed web bundle is current
        run: git diff --exit-code -- web/ui/dist

      - name: Upload server-only artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sim7600d-server-linux-amd64-${{ github.sha }}
          path: |
            artifacts/sim7600d-server-linux-amd64-*.tar.gz
            artifacts/sim7600d-server-linux-amd64-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sim7600d-web-${{ github.sha }}
          path: |
            artifacts/sim7600d-web-*.tar.gz
            artifacts/sim7600d-web-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundled server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sim7600d-server-web-linux-amd64-${{ github.sha }}
          path: |
            artifacts/sim7600d-server-web-linux-amd64-*.tar.gz
            artifacts/sim7600d-server-web-linux-amd64-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sim7600d-android-${{ github.sha }}
          path: |
            artifacts/sim7600d-android-*.apk
            artifacts/sim7600d-android-*.apk.sha256
          if-no-files-found: error
          retention-days: 14
