name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/client/package-lock.json
            web/ui/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test Go server
        run: go test ./...

      - name: Test headless server build
        run: go test -tags headless ./...

      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Install TypeScript client dependencies
        run: npm --prefix web/client ci --no-audit --no-fund

      - name: Install web UI dependencies
        run: npm --prefix web/ui ci --no-audit --no-fund

      - name: Test web UI
        run: |
          npm --prefix web/client run typecheck
          bash web/client/test/fixtures/run.sh
          npm --prefix web/ui run test
          npm --prefix web/ui run typecheck
          npm --prefix web/ui run lint

      - name: Audit JavaScript dependencies
        run: |
          npm --prefix web/client audit --audit-level=moderate
          npm --prefix web/ui audit --audit-level=moderate

      - name: Test Android app
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build packaged artifacts
        env:
          REQUIRE_SIGNED_ANDROID: "1"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: VERSION="$GITHUB_REF_NAME" ./scripts/build-artifacts.sh

      - name: Verify committed web bundle is current
        run: git diff --exit-code -- web/ui/dist

      - name: Stage verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ github.sha }}
          path: release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME" release-artifacts/*
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
